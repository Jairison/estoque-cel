<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Império Cell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/app.css?v=20261018">

<body>
  <main class="login-page">
    <section class="login-panel">
      <img class="login-logo" src="img/logo.png" alt="Império Cell">
      <div id="authBox"></div>

      <div class="login-foot">
        <span>© <span id="year"></span> Império Cell</span>

      </div>

    <section class="login-art" aria-hidden="true">
      <div class="art-copy">
        <div class="eyebrow">Estoque · iPhone</div>

        <p>Controle por modelo, capacidade, cor e IMEI, com histórico completo de movimentações e permissões por perfil.</p>
        <div class="feats" id="feats"></div>
